name: PromptPilot CI — Automated Testing Pipeline (Live Remote)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: E2E Live Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            selenium_tests/requirements.txt
            security_tests/requirements.txt
            appium_tests/requirements.txt

      - name: Set up Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome Version
        run: |
          chrome --version

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r selenium_tests/requirements.txt
          pip install -r security_tests/requirements.txt
          pip install -r appium_tests/requirements.txt

      - name: Verify ngrok Tunnel and App Health
        run: |
          max_attempts=30
          attempt=1
          while [ $attempt -le $max_attempts ]; do
            echo "Health check attempt $attempt/$max_attempts..."
            response=$(curl -s -o /dev/null -w "%{http_code}" https://drudgingly-unshivered-sarah.ngrok-free.dev)
            if [ "$response" = "200" ] || [ "$response" = "302" ]; then
              echo "✓ Application is responding with HTTP $response"
              sleep 5  # Give app time to fully initialize
              exit 0
            fi
            echo "Got HTTP $response, retrying in 2 seconds..."
            sleep 2
            attempt=$((attempt + 1))
          done
          echo "ERROR: Application health check failed after $max_attempts attempts"
          exit 1

      - name: Run Selenium E2E Test Suite
        run: |
          cd selenium_tests
          pytest -v --tb=short
        env:
          HEADLESS: "true"
          NEXTAUTH_SECRET: 3b82f6fitepSBEAwqefdLclsnmMXfpIryxAnsNjg
          NEXTAUTH_URL: https://drudgingly-unshivered-sarah.ngrok-free.dev
          DATABASE_URL: postgresql://postgres:HQvbhiEglDeCrKmLBwSrlJyrGAdMDngZ@kodama.proxy.rlwy.net:55746/railway?sslmode=require
          PYTEST_TIMEOUT: "60"

      - name: Run Security & Vulnerability Test Suite
        run: |
          cd security_tests
          pytest -v --tb=short
        env:
          HEADLESS: "true"
          NEXTAUTH_SECRET: 3b82f6fitepSBEAwqefdLclsnmMXfpIryxAnsNjg
          NEXTAUTH_URL: https://drudgingly-unshivered-sarah.ngrok-free.dev
          DATABASE_URL: postgresql://postgres:HQvbhiEglDeCrKmLBwSrlJyrGAdMDngZ@kodama.proxy.rlwy.net:55746/railway?sslmode=require
          PYTEST_TIMEOUT: "60"

      - name: Install Appium and UIAutomator2 Driver
        run: |
          npm install appium
          npx appium driver install uiautomator2

      - name: Run Appium Mobile E2E Test Suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          target: default
          arch: x86_64
          force-avd-creation: true
          emulator-options: -no-snapshot-load -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            npx appium --log appium.log &
            sleep 8
            cd appium_tests
            pytest -v --tb=short
        env:
          HEADLESS: "true"
          NEXTAUTH_SECRET: 3b82f6fitepSBEAwqefdLclsnmMXfpIryxAnsNjg
          NEXTAUTH_URL: https://drudgingly-unshivered-sarah.ngrok-free.dev
          DATABASE_URL: postgresql://postgres:HQvbhiEglDeCrKmLBwSrlJyrGAdMDngZ@kodama.proxy.rlwy.net:55746/railway?sslmode=require
          ADB_PATH: /usr/local/lib/android/sdk/platform-tools/adb
          PYTEST_TIMEOUT: "60"

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            selenium_tests/reports/
            security_tests/reports/
            appium_tests/reports/
            selenium_tests/TEST_EXECUTION_SUMMARY.md
            security_tests/VULNERABILITY_TEST_SUMMARY.md
            appium_tests/TEST_EXECUTION_SUMMARY.md
            appium_tests/test_automation_report.xlsx
