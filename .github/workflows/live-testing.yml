name: PromptPilot CI — Automated Testing Pipeline (Live Remote)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: E2E Live Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            selenium_tests/requirements.txt
            security_tests/requirements.txt

      - name: Set up Chrome & ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Chrome Version
        run: |
          chrome --version

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r selenium_tests/requirements.txt
          pip install -r security_tests/requirements.txt

      - name: Verify ngrok Tunnel is Active
        run: |
          echo "Checking if ngrok tunnel is online..."
          # ngrok endpoints return 200/302 normally, but we can do a curl to check reachability
          curl -I -s https://drudgingly-unshivered-sarah.ngrok-free.dev | grep -q "HTTP/"
          if [ $? -eq 0 ]; then
            echo "ngrok tunnel is online!"
          else
            echo "ERROR: ngrok tunnel is offline. Please make sure 'npm run dev' is running on your local machine."
            exit 1
          fi

      - name: Run Selenium E2E Test Suite
        run: |
          cd selenium_tests
          pytest -v --tb=short
        env:
          HEADLESS: "true"
          NEXTAUTH_SECRET: 3b82f6fitepSBEAwqefdLclsnmMXfpIryxAnsNjg
          NEXTAUTH_URL: https://drudgingly-unshivered-sarah.ngrok-free.dev
          DATABASE_URL: postgresql://postgres:HQvbhiEglDeCrKmLBwSrlJyrGAdMDngZ@kodama.proxy.rlwy.net:55746/railway?sslmode=require

      - name: Run Security & Vulnerability Test Suite
        run: |
          cd security_tests
          pytest -v --tb=short
        env:
          HEADLESS: "true"
          NEXTAUTH_SECRET: 3b82f6fitepSBEAwqefdLclsnmMXfpIryxAnsNjg
          NEXTAUTH_URL: https://drudgingly-unshivered-sarah.ngrok-free.dev
          DATABASE_URL: postgresql://postgres:HQvbhiEglDeCrKmLBwSrlJyrGAdMDngZ@kodama.proxy.rlwy.net:55746/railway?sslmode=require

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            selenium_tests/reports/
            security_tests/reports/
            selenium_tests/TEST_EXECUTION_SUMMARY.md
            security_tests/VULNERABILITY_TEST_SUMMARY.md
